# Broker MQTT del ambiente de pruebas.
# Escucha en la red interna de Docker; el puerto solo se publica en 127.0.0.1 (ver docker-compose.yml).
# Pendiente para equipos reales en campo: usuario por equipo y TLS en 8883 (ver arquitectura, nodo «Broker MQTT»).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
